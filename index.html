<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заявка студента</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Подача заявки</h1>

    <form id="studentForm">
      <label for="name">ФИО студента</label>
      <input type="text" id="name" required />

      <label for="email">Электронная почта</label>
      <input type="email" id="email" required />

      <label for="faculty">Факультет</label>
      <select id="faculty" required>
        <option value="">Выберите факультет</option>
        <option value="computer-science">Компьютерные науки</option>
        <option value="economics">Экономический</option>
        <option value="law">Юридический</option>
      </select>

      <label for="document">Документ</label>
      <input type="file" id="document" accept=".pdf,.doc,.docx" required />

      <button type="submit">Отправить заявку</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
