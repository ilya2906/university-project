<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Заявка студента</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Подача заявки</h1>

    
<form
  id="studentForm"
  action="https://script.google.com/macros/s/AKfycbw4x1AHsZ_6es7vEzFnbcIjqVnWYtlq94POdES7AhzvD4Lo6AiE1dVt3vPwTE2hYuDG/exec"
  method="POST"
  target="_blank"
>
  <label for="name">ФИО студента</label>
  <input
    type="text"
    id="name"
    name="name"
    maxlength="100"
    required
  >

  <label for="email">Email</label>
  <input
    type="email"
    id="email"
    name="email"
    maxlength="254"
    required
  >

  <label for="faculty">Факультет</label>
  <select id="faculty" name="faculty" required>
    <option value="">Выберите факультет</option>
    <option value="computer-science">
      Компьютерные науки
    </option>
    <option value="economics">
      Экономический
    </option>
    <option value="law">
      Юридический
    </option>
  </select>

  <button type="submit">
    Отправить заявку
  </button>
</form>

    <!--<script src="script.js"></script> -->
  </body>
</html>
